<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Viewer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f6f8fa;
    }

    body.dark {
      color-scheme: dark;
      background: #212830;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #viewport.dragging {
      cursor: grabbing;
    }

    #stage {
      position: absolute;
      inset: 0;
    }

    #stage svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
    }

    #toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid #d0d7de;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 3px 12px rgba(31, 35, 40, 0.15);
    }

    body.dark #toolbar {
      border-color: #444c56;
      background: rgba(45, 51, 59, 0.94);
    }

    #toolbar button {
      width: 38px;
      height: 36px;
      border: 0;
      border-right: 1px solid #d0d7de;
      color: #24292f;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }

    body.dark #toolbar button {
      border-right-color: #444c56;
      color: #adbac7;
    }

    #toolbar button:hover {
      background: rgba(175, 184, 193, 0.2);
    }

    #toolbar button:last-of-type {
      border-right: 0;
    }

    #zoom-label {
      min-width: 58px;
      padding: 0 8px;
      text-align: center;
      font-size: 12px;
    }

    #message {
      position: fixed;
      inset: 0;
      display: grid;
      padding: 32px;
      place-items: center;
      color: #57606a;
      text-align: center;
      pointer-events: none;
    }

    #message[hidden] {
      display: none;
    }

    body.dark #message {
      color: #adbac7;
    }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Mermaid diagram. Scroll to zoom and drag to pan.">
    <div id="stage"></div>
  </div>
  <div id="toolbar" aria-label="Diagram controls">
    <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="fit" type="button" title="Fit to screen" aria-label="Fit to screen">⌂</button>
  </div>
  <div id="message">Loading diagram…</div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const storageKey = params.get('key');
      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const message = document.getElementById('message');
      const zoomLabel = document.getElementById('zoom-label');
      let svg = null;
      let originalViewBox = null;
      let viewBox = null;
      let dragging = false;
      let pointerX = 0;
      let pointerY = 0;

      const updateViewBox = () => {
        if (!svg || !viewBox) return;
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.width} ${viewBox.height}`);
        const zoom = originalViewBox.width / viewBox.width;
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      };

      const clientToSvg = (clientX, clientY) => {
        const point = svg.createSVGPoint();
        point.x = clientX;
        point.y = clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      };

      const zoomAt = (factor, clientX, clientY) => {
        if (!svg || !viewBox) return;
        const currentZoom = originalViewBox.width / viewBox.width;
        const nextZoom = Math.min(20, Math.max(0.1, currentZoom * factor));
        const appliedFactor = nextZoom / currentZoom;
        const focus = clientToSvg(clientX, clientY);

        viewBox = {
          x: focus.x - (focus.x - viewBox.x) / appliedFactor,
          y: focus.y - (focus.y - viewBox.y) / appliedFactor,
          width: viewBox.width / appliedFactor,
          height: viewBox.height / appliedFactor
        };
        updateViewBox();
      };

      const fitToScreen = () => {
        if (!originalViewBox) return;
        viewBox = { ...originalViewBox };
        updateViewBox();
      };

      const zoomFromCenter = (factor) => {
        zoomAt(
          factor,
          viewport.clientWidth / 2,
          viewport.clientHeight / 2
        );
      };

      viewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY);
      }, { passive: false });

      viewport.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        dragging = true;
        pointerX = event.clientX;
        pointerY = event.clientY;
        viewport.classList.add('dragging');
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener('pointermove', (event) => {
        if (!dragging || !svg) return;
        const previous = clientToSvg(pointerX, pointerY);
        const current = clientToSvg(event.clientX, event.clientY);
        viewBox.x += previous.x - current.x;
        viewBox.y += previous.y - current.y;
        pointerX = event.clientX;
        pointerY = event.clientY;
        updateViewBox();
      });

      const stopDragging = () => {
        dragging = false;
        viewport.classList.remove('dragging');
      };

      viewport.addEventListener('pointerup', stopDragging);
      viewport.addEventListener('pointercancel', stopDragging);
      document.getElementById('zoom-in').addEventListener('click', () => zoomFromCenter(1.2));
      document.getElementById('zoom-out').addEventListener('click', () => zoomFromCenter(1 / 1.2));
      document.getElementById('fit').addEventListener('click', fitToScreen);

      try {
        const raw = storageKey ? localStorage.getItem(storageKey) : null;
        if (!raw) {
          throw new Error('Diagram data was not found. Please open it from the Markdown preview again.');
        }

        localStorage.removeItem(storageKey);
        const data = JSON.parse(raw);
        if (typeof data.svg !== 'string' || !data.svg.trim().startsWith('<svg')) {
          throw new Error('The diagram data is invalid.');
        }

        if (data.theme === 'dark') {
          document.body.classList.add('dark');
        }
        stage.innerHTML = data.svg;
        svg = stage.querySelector('svg');
        if (!svg) {
          throw new Error('The diagram SVG is missing.');
        }

        const values = (svg.getAttribute('viewBox') || '')
          .trim()
          .split(/[\s,]+/)
          .map(Number);
        if (values.length !== 4 || values.some((value) => !Number.isFinite(value))) {
          const width = svg.width.baseVal.value || svg.getBBox().width;
          const height = svg.height.baseVal.value || svg.getBBox().height;
          values.splice(0, values.length, 0, 0, width, height);
        }

        originalViewBox = {
          x: values[0],
          y: values[1],
          width: values[2],
          height: values[3]
        };
        viewBox = { ...originalViewBox };
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.maxWidth = 'none';
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        message.hidden = true;
        updateViewBox();
      } catch (error) {
        message.textContent = error.message || 'Unable to load the diagram.';
      }
    })();
  </script>
</body>
</html>
