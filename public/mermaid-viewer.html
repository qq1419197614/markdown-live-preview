<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Viewer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f6f8fa;
    }

    body.dark {
      color-scheme: dark;
      background: #212830;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #viewport.dragging {
      cursor: grabbing;
    }

    #stage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #stage svg {
      display: block;
      max-width: none;
      height: auto;
    }

    #toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid #d0d7de;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 3px 12px rgba(31, 35, 40, 0.15);
    }

    body.dark #toolbar {
      border-color: #444c56;
      background: rgba(45, 51, 59, 0.94);
    }

    #toolbar button {
      width: 38px;
      height: 36px;
      border: 0;
      border-right: 1px solid #d0d7de;
      color: #24292f;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }

    body.dark #toolbar button {
      border-right-color: #444c56;
      color: #adbac7;
    }

    #toolbar button:hover {
      background: rgba(175, 184, 193, 0.2);
    }

    #toolbar button:last-of-type {
      border-right: 0;
    }

    #zoom-label {
      min-width: 58px;
      padding: 0 8px;
      text-align: center;
      font-size: 12px;
    }

    #message {
      position: fixed;
      inset: 0;
      display: grid;
      padding: 32px;
      place-items: center;
      color: #57606a;
      text-align: center;
      pointer-events: none;
    }

    body.dark #message {
      color: #adbac7;
    }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Mermaid diagram. Scroll to zoom and drag to pan.">
    <div id="stage"></div>
  </div>
  <div id="toolbar" aria-label="Diagram controls">
    <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="fit" type="button" title="Fit to screen" aria-label="Fit to screen">⌂</button>
  </div>
  <div id="message">Loading diagram…</div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const storageKey = params.get('key');
      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const message = document.getElementById('message');
      const zoomLabel = document.getElementById('zoom-label');
      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let dragging = false;
      let pointerX = 0;
      let pointerY = 0;

      const updateTransform = () => {
        stage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        zoomLabel.textContent = `${Math.round(scale * 100)}%`;
      };

      const setScaleAt = (nextScale, clientX, clientY) => {
        const boundedScale = Math.min(8, Math.max(0.05, nextScale));
        const worldX = (clientX - translateX) / scale;
        const worldY = (clientY - translateY) / scale;
        scale = boundedScale;
        translateX = clientX - worldX * scale;
        translateY = clientY - worldY * scale;
        updateTransform();
      };

      const fitToScreen = () => {
        const svg = stage.querySelector('svg');
        if (!svg) return;

        const width = svg.getBoundingClientRect().width / scale || 1;
        const height = svg.getBoundingClientRect().height / scale || 1;
        const padding = 64;
        scale = Math.min(
          1,
          (viewport.clientWidth - padding * 2) / width,
          (viewport.clientHeight - padding * 2) / height
        );
        scale = Math.max(0.05, scale);
        translateX = (viewport.clientWidth - width * scale) / 2;
        translateY = (viewport.clientHeight - height * scale) / 2;
        updateTransform();
      };

      const zoomFromCenter = (factor) => {
        setScaleAt(
          scale * factor,
          viewport.clientWidth / 2,
          viewport.clientHeight / 2
        );
      };

      viewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        setScaleAt(scale * Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY);
      }, { passive: false });

      viewport.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        dragging = true;
        pointerX = event.clientX;
        pointerY = event.clientY;
        viewport.classList.add('dragging');
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        translateX += event.clientX - pointerX;
        translateY += event.clientY - pointerY;
        pointerX = event.clientX;
        pointerY = event.clientY;
        updateTransform();
      });

      const stopDragging = () => {
        dragging = false;
        viewport.classList.remove('dragging');
      };

      viewport.addEventListener('pointerup', stopDragging);
      viewport.addEventListener('pointercancel', stopDragging);
      document.getElementById('zoom-in').addEventListener('click', () => zoomFromCenter(1.2));
      document.getElementById('zoom-out').addEventListener('click', () => zoomFromCenter(1 / 1.2));
      document.getElementById('fit').addEventListener('click', fitToScreen);

      try {
        const raw = storageKey ? localStorage.getItem(storageKey) : null;
        if (!raw) {
          throw new Error('Diagram data was not found. Please open it from the Markdown preview again.');
        }

        localStorage.removeItem(storageKey);
        const data = JSON.parse(raw);
        if (typeof data.svg !== 'string' || !data.svg.trim().startsWith('<svg')) {
          throw new Error('The diagram data is invalid.');
        }

        if (data.theme === 'dark') {
          document.body.classList.add('dark');
        }
        stage.innerHTML = data.svg;
        message.hidden = true;
        requestAnimationFrame(fitToScreen);
      } catch (error) {
        message.textContent = error.message || 'Unable to load the diagram.';
      }
    })();
  </script>
</body>
</html>
